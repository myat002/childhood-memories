
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHILDHOOD MEMORIES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      background: #111;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    header h2 {
      letter-spacing: 3px;
      margin: 0;
    }
    nav {
      padding: 18px;
      text-align: center;
    }
    nav a {
      color: #aaa;
      text-decoration: none;
      margin: 10px;
    }
    .hero {
      padding: 80px 20px;
      text-align: center;
      background: #171717;
    }
    .hero h1 {
      font-size: 36px;
      letter-spacing: 3px;
    }
    .hero p { color: #aaa; }
    .section {
      padding: 30px 20px;
      text-align: center;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .category {
      background: #1c1c1c;
      border: 1px solid #333;
      padding: 22px;
      width: 140px;
      border-radius: 8px;
    }
    footer {
      padding: 25px;
      text-align: center;
      color: #777;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <header>
    <h2>CHILDHOOD MEMORIES</h2>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#movies">Movies</a>
    <a href="#categories">Categories</a>
  </nav>

  <section class="hero">
    <h1>RELIVE YOUR MEMORIES</h1>
    <p>Your favourite movies and series in one place.</p>
  </section>

  <section class="section" id="categories">
    <h2>Categories</h2>
    <div class="categories">
      <div class="category">Movies</div>
      <div class="category">Cartoons</div>
      <div class="category">K-Drama</div>
      <div class="category">Action</div>
      <div class="category">Series</div>
    </div>
  </section>

  <section class="section" id="movies">
    <h2>Latest Videos</h2>
    <p>Coming Soon...</p>
  </section>

  <footer>
    © 2026 CHILDHOOD MEMORIES
  </footer>
</body>
</html>
